name: Editor and security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: editor-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-fixture-only
      PGDATABASE: postgres
      REELS_FFMPEG_PATH: /usr/bin/ffmpeg
      REELS_FFPROBE_PATH: /usr/bin/ffprobe
    steps:
      # Public checkout avoids pre-existing orphan submodule entries.
      # No GitHub credentials are stored in the checkout or passed to app code.
      - name: Check out source
        env:
          CHECKOUT_REF: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/premspaw/SANDBOX-AI-STUDIO-.git
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci --ignore-scripts --no-fund
      - name: Resolve compatible security updates
        run: node scripts/refresh-security-dependencies.mjs
      - name: Syntax and database security checks
        run: |
          node --check server.js
          find server services -name '*.js' -print0 | xargs -0 -n1 node --check
          psql -v ON_ERROR_STOP=1 -f scripts/security-schema-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261024_security_boundaries.sql
          psql -v ON_ERROR_STOP=1 -f scripts/security-schema-checks.sql
      - name: Unit and security regression tests
        run: node --test server/tests/*.test.js tests/security/*.test.js server/mcp/tests/*.test.js tests/reels*.mjs
      - name: Production build
        run: npm run build
      - name: Real video export
        run: |
          node scripts/reels-smoke.mjs
          node scripts/reels-brand-smoke.mjs

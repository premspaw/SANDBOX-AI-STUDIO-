name: Editor and security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: editor-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REELS_FFMPEG_PATH: /usr/bin/ffmpeg
      REELS_FFPROBE_PATH: /usr/bin/ffprobe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci --ignore-scripts --no-fund
      - name: Unit and security regression tests
        run: node --test server/tests/*.test.js tests/security/*.test.js server/mcp/tests/*.test.js tests/reels*.mjs
      - name: Production build
        run: npm run build
      - name: Real video export
        run: node scripts/reels-smoke.mjs

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroLens Studio — Argon 4 Autonomous Video Editor + WebAudio SFX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050709;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      display: grid;
      grid-template-columns: 440px 1fr;
      height: 100vh;
      overflow: hidden;
    }
    /* Left Column: Preview Stage */
    #preview-column {
      background: #090d16;
      border-right: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #stage-wrapper {
      width: 378px;
      height: 672px;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0,0,0,0.9), 0 0 0 2px rgba(16, 185, 129, 0.4);
      background: #0f172a;
    }
    canvas { width: 100%; height: 100%; display: block; }
    /* Right Column: ZeroLens Argon 4 Edit Panel */
    #edit-panel {
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      gap: 14px;
      overflow-y: auto;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .file-label, button {
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .file-label { background: linear-gradient(135deg, #f59e0b, #ea580c); }
    #argonApiBtn { background: linear-gradient(135deg, #6366f1, #a855f7); }
    #playBtn { background: linear-gradient(135deg, #10b981, #2563eb); }
    #restartBtn { background: #1e293b; border: 1px solid #334155; }
    #exportBtn { background: linear-gradient(135deg, #ec4899, #8b5cf6); }
    #musicToggleBtn { background: #0f172a; border: 1px solid #334155; color: #38bdf8; }
    input[type="file"] { display: none; }
    .api-bar {
      display: flex;
      gap: 8px;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .api-bar input {
      flex: 1;
      background: #050709;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
    }
    .json-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 300px;
    }
    textarea {
      flex: 1;
      background: #090d16;
      color: #6ee7b7;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.45;
      resize: none;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 12px;
      color: #94a3b8;
    }
    #sourceVideo { display: none; }
  </style>
</head>
<body>

  <video id="sourceVideo" playsinline preload="auto" crossorigin="anonymous"></video>

  <!-- LEFT: 9:16 REEL STAGE -->
  <div id="preview-column">
    <div id="stage-wrapper">
      <canvas id="reelCanvas" width="1080" height="1920"></canvas>
    </div>
  </div>

  <!-- RIGHT: ZEROLENS ARGON 4 EDIT PANEL -->
  <div id="edit-panel">
    <div class="panel-header">
      <div>
        <h2 style="font-size: 18px; font-weight: 800;">ZeroLens Studio — Argon 4 Auto-Editor</h2>
        <p style="font-size: 12px; color: #94a3b8;">1:1 EDL Jump Cuts + Split-Screen Animations + Procedural WebAudio SFX + Music Ducking</p>
      </div>
      <span class="badge">gemini-4-argon • Agentic Video</span>
    </div>

    <div class="toolbar">
      <label class="file-label">
        📂 1. Select Raw Video (.mp4)
        <input type="file" id="videoInput" accept="video/*" />
      </label>
      <button id="argonApiBtn">✨ 2. Analyze via Argon 4 API</button>
      <button id="playBtn">▶ Play Edit + SFX</button>
      <button id="restartBtn">↺ Restart</button>
      <button id="musicToggleBtn">🎵 BGM Ducking: ON</button>
      <button id="exportBtn">⬇ Export Video + SFX (.webm)</button>
    </div>

    <div class="api-bar">
      <input type="text" id="apiEndpoint" value="/api/argon-auto-edit" placeholder="Backend Argon 4 Endpoint URL (default: /api/argon-auto-edit or http://localhost:3001/api/argon-auto-edit)" />
      <button id="applyJsonBtn" style="background:#059669;">✓ Apply Edited JSON</button>
    </div>

    <div class="status-bar">
      <span id="statusText">Ready • Loaded Default Argon 4 Photosynthesis Manifest (with 18 SFX triggers)</span>
      <span id="timerDisplay">0.00s / 39.60s</span>
    </div>

    <div class="json-box">
      <label style="font-size: 12px; font-weight: 700; color: #cbd5e1;">
        Argon 4 Structured Output (`EditManifest` JSON — Live Editable):
      </label>
      <textarea id="manifestEditor" spellcheck="false"></textarea>
    </div>
  </div>

  <script>
    // ============================================================================
    // 1. DEFAULT ARGON 4 EDIT MANIFEST (Generated from Photosynthesis Video)
    // ============================================================================
    let EDIT_MANIFEST = {
      totalDuration: 39.6,
      edlSegments: [
        { idx: 0, editStart: 0.0,  editEnd: 4.3,  rawStart: 1.0,  rawEnd: 5.3,  layout: "TOP_BOTTOM_50", zoom: 1.08 },
        { idx: 1, editStart: 4.3,  editEnd: 9.9,  rawStart: 7.0,  rawEnd: 12.6, layout: "SIDE_BY_SIDE_50", zoom: 1.18 },
        { idx: 2, editStart: 9.9,  editEnd: 13.6, rawStart: 12.8, rawEnd: 16.5, layout: "TOP_BOTTOM_50", zoom: 1.10 },
        { idx: 3, editStart: 13.6, editEnd: 24.7, rawStart: 17.3, rawEnd: 28.4, layout: "TOP_BOTTOM_50", zoom: 1.15 },
        { idx: 4, editStart: 24.7, editEnd: 33.6, rawStart: 31.8, rawEnd: 40.7, layout: "TOP_BOTTOM_50", zoom: 1.12 },
        { idx: 5, editStart: 33.6, editEnd: 39.6, rawStart: 42.3, rawEnd: 42.3, layout: "APPENDED_FULL_ANIMATION", zoom: 1.0 }
      ],
      scenes: [
        {
          segIdx: 0, template: "CONCEPT_HOOK",
          title: "PHOTOSYNTHESIS", subtitle: "☀️ Sunlight → 🌱 Plant Food",
          badgeText: "☀️", accentColor: "#065f46", items: []
        },
        {
          segIdx: 1, template: "ANALOGY_CARD",
          title: "SOLAR", subtitle: "KITCHEN",
          badgeText: "3 INGREDIENTS", accentColor: "#10b981", items: []
        },
        {
          segIdx: 2, template: "WHEEL_LIST",
          title: "3 Core Inputs", subtitle: "", badgeText: "", accentColor: "#0f172a",
          items: [
            { label: "1. Sunlight ☀️", sublabel: "", color: "#d97706" },
            { label: "2. Water (H₂O) 💧", sublabel: "", color: "#0284c7" },
            { label: "3. Carbon Dioxide 🌬️", sublabel: "", color: "#059669" }
          ]
        },
        {
          segIdx: 3, template: "ORBIT_ENGINE",
          title: "CHLOROPHYLL ENGINE", subtitle: "⚡ TRAPPING SUNLIGHT ENERGY ⚡",
          badgeText: "", accentColor: "#10b981",
          items: [
            { label: "H₂O", sublabel: "", color: "#0284c7" },
            { label: "CO₂", sublabel: "", color: "#334155" }
          ]
        },
        {
          segIdx: 4, template: "DUAL_CARDS",
          title: "Outputs", subtitle: "", badgeText: "", accentColor: "#10b981",
          items: [
            { label: "1. SUGAR", sublabel: "Plant Food 🌱", color: "#eab308" },
            { label: "2. OXYGEN", sublabel: "Clean Air 🌍", color: "#10b981" }
          ]
        },
        {
          segIdx: 5, template: "COSMIC_FINALE",
          title: "Photosynthesis", subtitle: "☀️ Sunlight + 💧 H₂O + 🌬️ CO₂",
          badgeText: "= 🌱 Sugar + 🌍 Oxygen", accentColor: "#10b981", items: []
        }
      ],
      captions: [
        { start: 0.0,  end: 2.1,  words: ["Photosynthesis", "is", "how", "plants"] },
        { start: 2.1,  end: 4.3,  words: ["make", "their", "own", "food", "using", "sunlight."] },
        { start: 4.3,  end: 7.0,  words: ["Think", "of", "plant", "leaves", "like", "a", "tiny"] },
        { start: 7.0,  end: 9.9,  words: ["solar-powered", "kitchen", "with", "3", "ingredients:"] },
        { start: 9.9,  end: 13.6, words: ["Sunlight,", "Water,", "and", "Carbon", "Dioxide."] },
        { start: 13.6, end: 17.1, words: ["Inside", "the", "leaves,", "a", "green", "pigment"] },
        { start: 17.1, end: 20.5, words: ["called", "Chlorophyll", "traps", "sunlight", "energy"] },
        { start: 20.5, end: 23.3, words: ["to", "mix", "water", "and", "CO₂", "together,"] },
        { start: 23.3, end: 24.7, words: ["creating", "two", "things:"] },
        { start: 24.7, end: 27.9, words: ["Sugar", "(food", "the", "plant", "eats", "to", "grow)"] },
        { start: 27.9, end: 31.0, words: ["and", "Oxygen:", "clean", "air", "released"] },
        { start: 31.0, end: 33.6, words: ["for", "humans", "&", "animals", "to", "breathe!"] },
        { start: 33.6, end: 36.6, words: ["6CO₂", "+", "6H₂O", "+", "Sunlight", "→"] },
        { start: 36.6, end: 39.6, words: ["Glucose", "Sugar", "🌱", "+", "Pure", "Oxygen", "🌍"] }
      ],
      sfxEvents: [
        { time: 0.05, type: "POP", intensity: 0.8 },
        { time: 4.30, type: "WHOOSH", intensity: 0.9 },
        { time: 4.45, type: "POP", intensity: 0.7 },
        { time: 9.90, type: "WHOOSH", intensity: 0.85 },
        { time: 9.95, type: "DING", intensity: 0.75 },
        { time: 11.05, type: "DING", intensity: 0.75 },
        { time: 12.20, type: "DING", intensity: 0.85 },
        { time: 13.60, type: "WHOOSH", intensity: 0.9 },
        { time: 24.70, type: "WHOOSH", intensity: 0.85 },
        { time: 24.75, type: "POP", intensity: 0.9 },
        { time: 27.90, type: "POP", intensity: 0.9 },
        { time: 28.00, type: "DING", intensity: 0.8 },
        { time: 33.00, type: "RISER", intensity: 0.85 },
        { time: 33.60, type: "SUCCESS_CHORD", intensity: 0.9 }
      ]
    };

    const canvas = document.getElementById('reelCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('sourceVideo');
    const videoInput = document.getElementById('videoInput');
    const argonApiBtn = document.getElementById('argonApiBtn');
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const exportBtn = document.getElementById('exportBtn');
    const applyJsonBtn = document.getElementById('applyJsonBtn');
    const manifestEditor = document.getElementById('manifestEditor');
    const timerDisplay = document.getElementById('timerDisplay');
    const statusText = document.getElementById('statusText');

    manifestEditor.value = JSON.stringify(EDIT_MANIFEST, null, 2);

    let selectedFile = null;
    let videoReady = false;
    let lastSegmentIndex = -1;
    let firedSfxIndices = new Set();
    let bgmEnabled = true;

    // ============================================================================
    // 2. PROCEDURAL WEB AUDIO API SOUND EFFECTS & DUCKING ENGINE
    // ============================================================================
    let audioCtx = null;
    let masterBus = null;
    let bgmGain = null;
    let bgmOsc = null;
    let bgmOsc2 = null;
    let exportAudioDest = null;
    let videoSourceConnected = false;

    function ensureAudioGraph() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterBus = audioCtx.createGain();
        masterBus.gain.value = 1.0;

        // BGM Ducking Bus
        bgmGain = audioCtx.createGain();
        bgmGain.gain.setValueAtTime(0.18, audioCtx.currentTime); // ducked default
        bgmGain.connect(masterBus);

        // Ambient Lo-Fi Harmonic Bed (Synthesized procedural background music)
        try {
          bgmOsc = audioCtx.createOscillator();
          bgmOsc.type = "sine";
          bgmOsc.frequency.setValueAtTime(110, audioCtx.currentTime); // A2 warm drone

          bgmOsc2 = audioCtx.createOscillator();
          bgmOsc2.type = "triangle";
          bgmOsc2.frequency.setValueAtTime(164.81, audioCtx.currentTime); // E3 fifth

          const filter = audioCtx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(420, audioCtx.currentTime);

          bgmOsc.connect(filter);
          bgmOsc2.connect(filter);
          filter.connect(bgmGain);

          bgmOsc.start();
          bgmOsc2.start();
        } catch(e) {}

        exportAudioDest = audioCtx.createMediaStreamDestination();
        masterBus.connect(audioCtx.destination);
        masterBus.connect(exportAudioDest);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (!videoSourceConnected && video) {
        try {
          const vNode = audioCtx.createMediaElementSource(video);
          vNode.connect(masterBus);
          videoSourceConnected = true;
        } catch (e) {}
      }
    }

    // Dynamic BGM Ducking: dips to 0.14 when speaker talks, swells to 0.70 during finale!
    function updateBgmDucking(editTime, isFinale) {
      if (!bgmGain || !bgmEnabled) {
        if (bgmGain) bgmGain.gain.setValueAtTime(0, audioCtx.currentTime);
        return;
      }
      const now = audioCtx.currentTime;
      const targetGain = isFinale ? 0.72 : 0.16;
      bgmGain.gain.setTargetAtTime(targetGain, now, 0.25);
    }

    musicToggleBtn.addEventListener('click', () => {
      bgmEnabled = !bgmEnabled;
      musicToggleBtn.textContent = `🎵 BGM Ducking: ${bgmEnabled ? 'ON' : 'OFF'}`;
      musicToggleBtn.style.color = bgmEnabled ? '#38bdf8' : '#94a3b8';
    });

    function triggerProceduralSFX(type, intensity = 0.8) {
      ensureAudioGraph();
      const now = audioCtx.currentTime;

      if (type === "POP") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(130, now + 0.09);
        gain.gain.setValueAtTime(0.35 * intensity, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain); gain.connect(masterBus);
        osc.start(now); osc.stop(now + 0.095);
      }
      else if (type === "DING") {
        [1046.5, 2093.0].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime((i === 0 ? 0.25 : 0.12) * intensity, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.connect(gain); gain.connect(masterBus);
          osc.start(now); osc.stop(now + 0.46);
        });
      }
      else if (type === "WHOOSH") {
        const bufferSize = audioCtx.sampleRate * 0.28;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.Q.value = 2.2;
        filter.frequency.setValueAtTime(280, now);
        filter.frequency.exponentialRampToValueAtTime(2200, now + 0.14);
        filter.frequency.exponentialRampToValueAtTime(400, now + 0.28);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.38 * intensity, now + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

        noise.connect(filter); filter.connect(gain); gain.connect(masterBus);
        noise.start(now); noise.stop(now + 0.29);
      }
      else if (type === "RISER") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.58);
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.22 * intensity, now + 0.5);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.connect(gain); gain.connect(masterBus);
        osc.start(now); osc.stop(now + 0.61);
      }
      else if (type === "SUCCESS_CHORD") {
        [261.63, 329.63, 392.00, 523.25, 659.25].forEach((freq) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.12 * intensity, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
          osc.connect(gain); gain.connect(masterBus);
          osc.start(now); osc.stop(now + 1.85);
        });
      }
    }

    // ============================================================================
    // 3. FILE LOADING & ARGON 4 API UPLOAD HANDLER
    // ============================================================================
    videoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      selectedFile = file;
      video.src = URL.createObjectURL(file);
      video.load();
      video.onloadeddata = () => {
        videoReady = true;
        statusText.textContent = `Loaded "${file.name}" • Playing with active Argon 4 Manifest`;
        startPlaybackFromBeginning();
      };
    });

    argonApiBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        alert("Select a raw .mp4 file first using button #1!");
        return;
      }
      const endpoint = document.getElementById('apiEndpoint').value.trim();
      argonApiBtn.disabled = true;
      argonApiBtn.textContent = "⏳ Argon 4 Analyzing Video...";
      statusText.textContent = "Uploading raw video to Gemini 4 Argon (processing: agentic)...";

      try {
        const formData = new FormData();
        formData.append("video", selectedFile);
        const res = await fetch(endpoint, { method: "POST", body: formData });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const newManifest = await res.json();
        EDIT_MANIFEST = newManifest;
        manifestEditor.value = JSON.stringify(EDIT_MANIFEST, null, 2);
        statusText.textContent = "✅ Argon 4 API generated new EditManifest + SFX!";
        startPlaybackFromBeginning();
      } catch (err) {
        statusText.textContent = `⚠️ API Notice (${err.message}) — running with local high-retention manifest.`;
      } finally {
        argonApiBtn.disabled = false;
        argonApiBtn.textContent = "✨ 2. Analyze via Argon 4 API";
      }
    });

    applyJsonBtn.addEventListener('click', () => {
      try {
        EDIT_MANIFEST = JSON.parse(manifestEditor.value);
        statusText.textContent = "✅ Custom JSON Manifest Applied!";
        startPlaybackFromBeginning();
      } catch (e) {
        alert("Invalid JSON in editor: " + e.message);
      }
    });

    // ============================================================================
    // 4. UNIVERSAL PARAMETRIC RENDER ENGINE (Driven 100% by EDIT_MANIFEST)
    // ============================================================================
    const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
    const easeOutBack = (x) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    };

    function mapEditedTimeToRaw(editTime) {
      const segs = EDIT_MANIFEST.edlSegments;
      const seg = segs.find(s => editTime >= s.editStart && editTime < s.editEnd) || segs[segs.length - 1];
      const offset = editTime - seg.editStart;
      return { rawTime: Math.min(seg.rawEnd, seg.rawStart + offset), seg };
    }

    function drawRawVideoLayer(t, seg) {
      if (seg.layout === "APPENDED_FULL_ANIMATION") return;
      ctx.save();
      const vw = videoReady ? (video.videoWidth || 1080) : 1080;
      const vh = videoReady ? (video.videoHeight || 1920) : 1920;

      if (seg.layout === "TOP_BOTTOM_50") {
        ctx.beginPath(); ctx.rect(0, 0, 1080, 960); ctx.clip();
        if (videoReady) {
          const scale = Math.max(1080 / vw, 960 / vh) * (seg.zoom || 1.1);
          const dw = vw * scale, dh = vh * scale;
          ctx.drawImage(video, (1080 - dw) / 2, (960 - dh) / 2 + 60, dw, dh);
        } else {
          drawSelectVideoPrompt(0, 0, 1080, 960);
        }
        ctx.strokeStyle = '#10b981'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(0, 956); ctx.lineTo(1080, 956); ctx.stroke();
      } else if (seg.layout === "SIDE_BY_SIDE_50") {
        ctx.beginPath(); ctx.rect(0, 0, 540, 1920); ctx.clip();
        if (videoReady) {
          const scale = Math.max(540 / vw, 1920 / vh) * (seg.zoom || 1.15);
          const dw = vw * scale, dh = vh * scale;
          ctx.drawImage(video, (540 - dw) / 2, (1920 - dh) / 2, dw, dh);
        } else {
          drawSelectVideoPrompt(0, 0, 540, 1920);
        }
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(536, 0); ctx.lineTo(536, 1920); ctx.stroke();
      }
      ctx.restore();
    }

    function drawSelectVideoPrompt(x, y, w, h) {
      ctx.fillStyle = '#0f172a'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#f59e0b'; ctx.font = '800 32px Inter, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('👆 Click "📂 1. Select Raw Video (.mp4)"', x + w / 2, y + h / 2);
    }

    function drawAnimationsLayer(t, seg) {
      const scene = EDIT_MANIFEST.scenes.find(s => s.segIdx === seg.idx) || EDIT_MANIFEST.scenes[0];
      if (!scene) return;
      const localT = t - seg.editStart;
      ctx.save();

      if (scene.template === "CONCEPT_HOOK") {
        ctx.beginPath(); ctx.rect(0, 960, 1080, 960); ctx.clip();
        const bg = ctx.createLinearGradient(0, 960, 0, 1920);
        bg.addColorStop(0, '#fef9c3'); bg.addColorStop(1, '#bbf7d0');
        ctx.fillStyle = bg; ctx.fillRect(0, 960, 1080, 960);

        const pop = easeOutBack(clamp(localT / 0.55));
        ctx.translate(540, 1460); ctx.scale(pop, pop);
        ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(0, -195, 95, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(-430, -80, 860, 340, 28); ctx.fill();
        ctx.fillStyle = scene.accentColor || '#065f46'; ctx.font = '900 68px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(scene.title, 0, 35);
        ctx.fillStyle = '#15803d'; ctx.font = '700 38px Inter, sans-serif';
        ctx.fillText(scene.subtitle, 0, 125);
      }
      else if (scene.template === "ANALOGY_CARD") {
        ctx.beginPath(); ctx.rect(540, 0, 540, 1920); ctx.clip();
        const bg = ctx.createLinearGradient(540, 0, 540, 1920);
        bg.addColorStop(0, '#0f172a'); bg.addColorStop(1, '#064e3b');
        ctx.fillStyle = bg; ctx.fillRect(540, 0, 540, 1920);

        const pop = easeOutBack(clamp(localT / 0.55));
        ctx.translate(810, 960); ctx.scale(pop, pop);
        ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.roundRect(-230, -500, 460, 1000, 30); ctx.fill();
        ctx.fillStyle = '#0f172a'; ctx.font = '900 54px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(scene.title, 0, -310); ctx.fillText(scene.subtitle, 0, -245);

        ctx.save(); ctx.rotate(Math.sin(localT * 4) * 0.08);
        ctx.fillStyle = scene.accentColor || '#10b981';
        ctx.beginPath(); ctx.ellipse(0, 0, 150, 95, -0.3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#2563eb'; ctx.beginPath(); ctx.roundRect(-185, 230, 370, 110, 22); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.font = '800 36px Inter, sans-serif';
        ctx.fillText(scene.badgeText || 'KEY ANALOGY', 0, 298);
      }
      else if (scene.template === "WHEEL_LIST") {
        ctx.beginPath(); ctx.rect(0, 960, 1080, 960); ctx.clip();
        ctx.fillStyle = '#f8fafc'; ctx.fillRect(0, 960, 1080, 960);
        const items = scene.items || [];
        const stepDur = (seg.editEnd - seg.editStart) / Math.max(1, items.length);
        const activeIdx = Math.min(items.length - 1, Math.floor(localT / stepDur));
        ctx.font = '900 68px Inter, sans-serif'; ctx.textAlign = 'left';
        items.forEach((it, idx) => {
          const isCurrent = idx === activeIdx;
          const y = 1360 + (idx - activeIdx) * 145;
          ctx.fillStyle = isCurrent ? (it.color || '#0284c7') : 'rgba(15, 23, 42, 0.16)';
          ctx.fillText(it.label, 180, y);
          if (isCurrent) ctx.fillText('→', 85, y);
        });
      }
      else if (scene.template === "ORBIT_ENGINE") {
        ctx.beginPath(); ctx.rect(0, 960, 1080, 960); ctx.clip();
        ctx.fillStyle = '#022c22'; ctx.fillRect(0, 960, 1080, 960);
        ctx.translate(540, 1450);
        ctx.fillStyle = scene.accentColor || '#10b981';
        ctx.beginPath(); ctx.roundRect(-450, -280, 900, 540, 32); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.font = '900 56px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(scene.title, 0, -155);

        const angle = localT * 3.5;
        const itemA = scene.items?.[0] || { label: "H₂O", color: "#0284c7" };
        const itemB = scene.items?.[1] || { label: "CO₂", color: "#334155" };

        ctx.fillStyle = itemA.color; ctx.beginPath(); ctx.arc(Math.cos(angle) * 210, 15, 78, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '800 36px Inter, sans-serif'; ctx.fillText(itemA.label, Math.cos(angle) * 210, 27);

        ctx.fillStyle = itemB.color; ctx.beginPath(); ctx.arc(Math.cos(angle + Math.PI) * 210, 15, 78, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillText(itemB.label, Math.cos(angle + Math.PI) * 210, 27);

        ctx.fillStyle = '#fef08a'; ctx.font = '800 36px monospace';
        ctx.fillText(scene.subtitle, 0, 190);
      }
      else if (scene.template === "DUAL_CARDS") {
        ctx.beginPath(); ctx.rect(0, 960, 1080, 960); ctx.clip();
        ctx.fillStyle = '#030712'; ctx.fillRect(0, 960, 1080, 960);
        const card1 = scene.items?.[0] || { label: "1. SUGAR", sublabel: "Plant Food 🌱", color: "#eab308" };
        const card2 = scene.items?.[1] || { label: "2. OXYGEN", sublabel: "Clean Air 🌍", color: "#10b981" };

        const p1 = easeOutBack(clamp(localT / 0.5));
        ctx.save(); ctx.translate(290, 1450); ctx.scale(p1, p1);
        ctx.fillStyle = card1.color; ctx.beginPath(); ctx.roundRect(-220, -240, 440, 480, 26); ctx.fill();
        ctx.fillStyle = '#0f172a'; ctx.font = '900 56px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(card1.label, 0, -40);
        ctx.font = '700 34px Inter, sans-serif'; ctx.fillText(card1.sublabel, 0, 50);
        ctx.restore();

        const p2 = easeOutBack(clamp((localT - 3.2) / 0.55));
        ctx.save(); ctx.translate(790, 1450); ctx.scale(p2, p2);
        ctx.fillStyle = card2.color; ctx.beginPath(); ctx.roundRect(-220, -240, 440, 480, 26); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.font = '900 56px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(card2.label, 0, -40);
        ctx.font = '700 34px Inter, sans-serif'; ctx.fillText(card2.sublabel, 0, 50);
        ctx.restore();
      }
      else if (scene.template === "COSMIC_FINALE") {
        ctx.fillStyle = '#020b07'; ctx.fillRect(0, 0, 1080, 1920);
        const glow = ctx.createRadialGradient(540, 1920, 200, 540, 1920, 1100);
        glow.addColorStop(0, '#ffffff'); glow.addColorStop(0.3, '#10b981'); glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow; ctx.fillRect(0, 0, 1080, 1920);

        for (let b = 0; b < 14; b++) {
          const bx = 120 + (b * 75) % 840 + Math.sin(localT * 3 + b) * 30;
          const by = 1800 - ((localT * 260 + b * 130) % 1600);
          ctx.fillStyle = 'rgba(52, 211, 153, 0.3)';
          ctx.beginPath(); ctx.arc(bx, by, 34, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ffffff'; ctx.font = '800 22px Inter, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('O₂', bx, by + 8);
        }

        const pop = easeOutBack(clamp(localT / 0.6));
        ctx.save(); ctx.translate(540, 780); ctx.scale(pop, pop); ctx.textAlign = 'center';
        ctx.fillStyle = '#34d399'; ctx.font = '800 34px monospace';
        ctx.fillText('ARGON 4 VISUAL SUMMARY', 0, -180);
        ctx.fillStyle = '#ffffff'; ctx.font = '900 105px Inter, sans-serif';
        ctx.fillText(scene.title, 0, -40);
        ctx.fillStyle = '#fef08a'; ctx.font = '800 48px Inter, sans-serif';
        ctx.fillText(scene.subtitle, 0, 90);
        ctx.fillStyle = '#6ee7b7'; ctx.font = 'italic 700 64px Georgia, serif';
        ctx.fillText(scene.badgeText, 0, 200);
        ctx.restore();
      }
      ctx.restore();
    }

    function drawKaraokeCaptions(t, seg) {
      const activeSeg = EDIT_MANIFEST.captions.find(c => t >= c.start && t <= c.end);
      if (!activeSeg) return;

      const prog = clamp((t - activeSeg.start) / (activeSeg.end - activeSeg.start));
      const activeIdx = Math.min(activeSeg.words.length - 1, Math.floor(prog * activeSeg.words.length));

      ctx.save();
      ctx.font = '900 52px Inter, "Arial Black", sans-serif';
      ctx.textBaseline = 'middle';

      const spaceW = 18;
      const widths = activeSeg.words.map(w => ctx.measureText(w).width);
      const totalW = widths.reduce((a, b) => a + b, 0) + spaceW * (activeSeg.words.length - 1);
      let startX = (1080 - totalW) / 2;
      const captionY = seg.layout === "SIDE_BY_SIDE_50" ? 1680 : (seg.layout === "APPENDED_FULL_ANIMATION" ? 1420 : 960);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.beginPath(); ctx.roundRect(startX - 32, captionY - 54, totalW + 64, 108, 26); ctx.fill();

      let pillX = startX;
      for (let i = 0; i < activeIdx; i++) pillX += widths[i] + spaceW;
      ctx.fillStyle = '#8b2cf5';
      ctx.beginPath(); ctx.roundRect(pillX - 12, captionY - 40, widths[activeIdx] + 24, 80, 14); ctx.fill();

      let wordX = startX;
      activeSeg.words.forEach((word, i) => {
        ctx.lineJoin = 'round'; ctx.lineWidth = 12; ctx.strokeStyle = '#000000';
        ctx.strokeText(word, wordX, captionY);
        ctx.fillStyle = '#ffffff'; ctx.fillText(word, wordX, captionY);
        wordX += widths[i] + spaceW;
      });
      ctx.restore();
    }

    // ============================================================================
    // 5. MASTER TIMELINE LOOP + SFX DISPATCHER + VIDEO EXPORTER
    // ============================================================================
    let isPlaying = false;
    let startTime = null;
    let currentTime = 0;
    let mediaRecorder = null;
    let recordedChunks = [];

    window.renderAtTime = function(editTime) {
      const { rawTime, seg } = mapEditedTimeToRaw(editTime);
      const isFinale = seg.layout === "APPENDED_FULL_ANIMATION";

      // Background music ducking check
      updateBgmDucking(editTime, isFinale);

      // Fire any procedural SFX scheduled up to current editTime
      if (isPlaying && EDIT_MANIFEST.sfxEvents) {
        EDIT_MANIFEST.sfxEvents.forEach((sfx, idx) => {
          if (!firedSfxIndices.has(idx) && editTime >= sfx.time && editTime - sfx.time < 0.25) {
            firedSfxIndices.add(idx);
            triggerProceduralSFX(sfx.type, sfx.intensity || 0.8);
          }
        });
      }

      if (videoReady && !isFinale) {
        if (seg.idx !== lastSegmentIndex || Math.abs(video.currentTime - rawTime) > 0.12) {
          video.currentTime = rawTime;
          lastSegmentIndex = seg.idx;
        }
        if (isPlaying && video.paused) video.play().catch(() => {});
      } else if (videoReady && isFinale) {
        if (!video.paused) video.pause();
        lastSegmentIndex = seg.idx;
      }

      ctx.clearRect(0, 0, 1080, 1920);
      drawRawVideoLayer(editTime, seg);
      drawAnimationsLayer(editTime, seg);
      drawKaraokeCaptions(editTime, seg);

      timerDisplay.textContent = `${editTime.toFixed(2)}s / ${EDIT_MANIFEST.totalDuration.toFixed(2)}s`;
    };

    function loop(ts) {
      if (!isPlaying) return;
      if (!startTime) startTime = ts;
      currentTime = (ts - startTime) / 1000;

      if (currentTime >= EDIT_MANIFEST.totalDuration) {
        currentTime = EDIT_MANIFEST.totalDuration;
        window.renderAtTime(currentTime);
        isPlaying = false;
        if (videoReady) video.pause();
        playBtn.textContent = '▶ Replay Edit + SFX';
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        return;
      }

      window.renderAtTime(currentTime);
      requestAnimationFrame(loop);
    }

    function startPlaybackFromBeginning() {
      ensureAudioGraph();
      currentTime = 0;
      lastSegmentIndex = -1;
      firedSfxIndices.clear();
      startTime = performance.now();
      isPlaying = true;
      if (videoReady) {
        video.currentTime = EDIT_MANIFEST.edlSegments[0].rawStart;
        video.play();
      }
      playBtn.textContent = '⏸ Pause Edit';
      requestAnimationFrame(loop);
    }

    playBtn.addEventListener('click', () => {
      ensureAudioGraph();
      if (isPlaying) {
        isPlaying = false;
        if (videoReady) video.pause();
        playBtn.textContent = '▶ Resume Edit';
        return;
      }
      if (currentTime >= EDIT_MANIFEST.totalDuration) {
        startPlaybackFromBeginning();
        return;
      }
      lastSegmentIndex = -1;
      startTime = performance.now() - currentTime * 1000;
      isPlaying = true;
      const { rawTime, seg } = mapEditedTimeToRaw(currentTime);
      if (videoReady && seg.layout !== "APPENDED_FULL_ANIMATION") {
        video.currentTime = rawTime;
        video.play();
      }
      playBtn.textContent = '⏸ Pause Edit';
      requestAnimationFrame(loop);
    });

    restartBtn.addEventListener('click', startPlaybackFromBeginning);

    exportBtn.addEventListener('click', () => {
      if (!videoReady) {
        alert("Please select your raw video (.mp4) first using button #1!");
        return;
      }
      ensureAudioGraph();
      exportBtn.disabled = true;
      exportBtn.textContent = "⏺ Recording Video + SFX + BGM...";
      recordedChunks = [];

      const canvasStream = canvas.captureStream(60);
      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...exportAudioDest.stream.getAudioTracks()
      ]);

      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
        ? 'video/webm;codecs=vp9,opus'
        : 'video/webm';

      mediaRecorder = new MediaRecorder(combinedStream, { mimeType, videoBitsPerSecond: 12000000 });
      mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: mimeType });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'zerolens_argon4_complete_edit.webm';
        a.click();
        exportBtn.disabled = false;
        exportBtn.textContent = "⬇ Export Video + SFX (.webm)";
      };

      mediaRecorder.start(100);
      startPlaybackFromBeginning();
    });

    window.renderAtTime(0.0);
  </script>
</body>


<style>
  .wrap { padding: 2.5rem 0; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; }
  .panel { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2.5rem 1.5rem 1.5rem; gap: 1.25rem; }
  .panel:nth-child(1) { background: #0a0a0a; border-radius: 16px 0 0 16px; }
  .panel:nth-child(2) { background: #111; border-left: 1px solid #222; border-right: 1px solid #222; }
  .panel:nth-child(3) { background: #f5f5f2; border-radius: 0 16px 16px 0; }
  .caption { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; }
  .panel:nth-child(1) .caption, .panel:nth-child(2) .caption { color: #555; }
  .panel:nth-child(3) .caption { color: #aaa; }
  .divider { width: 100%; height: 1px; background: #222; margin: 1rem 0; }
  .sizes { display: flex; align-items: center; gap: 20px; padding: 1.5rem; background: #0a0a0a; border-radius: 12px; justify-content: center; margin-top: 1.5rem; }
</style>

        <g fill="none" stroke="#AADD00" stroke-width="1" opacity="0.18">
          <path d="M80 24 A56 56 0 0 1 128.5 52"/>
          <path d="M128.5 52 A56 56 0 0 1 128.5 108"/>
          <path d="M128.5 108 A56 56 0 0 1 80 136"/>
          <path d="M80 136 A56 56 0 0 1 31.5 108"/>
          <path d="M31.5 108 A56 56 0 0 1 31.5 52"/>
          <path d="M31.5 52 A56 56 0 0 1 80 24"/>
        </g>
        <!-- Z letterform — bold, centered, inscribed -->
        <!-- Top bar -->
        <line x1="50" y1="46" x2="110" y2="46" stroke="#AADD00" stroke-width="8" stroke-linecap="round"/>
        <!-- Diagonal -->
        <line x1="110" y1="46" x2="50" y2="114" stroke="#AADD00" stroke-width="8" stroke-linecap="round"/>
        <!-- Bottom bar -->
        <line x1="50" y1="114" x2="110" y2="114" stroke="#AADD00" stroke-width="8" stroke-linecap="round"/>
        <!-- Lens glint dot top-right -->
        <circle cx="116" cy="44" r="4.5" fill="#AADD00" opacity="0.55"/>
      </svg>
      <div class="caption">Dark / primary</div>
